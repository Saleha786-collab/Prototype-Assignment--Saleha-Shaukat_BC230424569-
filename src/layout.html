
<!DOCTYPE html>
<html>
<head>
    <title>SavorSuites</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <style>
        /* Smooth scrolling for nav links */
        html {
            scroll-behavior: smooth;
        }
    </style>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a class="logo" href="#home">SavorSuites</a>
        </div>
    
        <div class="navbar-right">
            <a class="navbar-link" href="{{ url_for('home') }}">Home</a>
            <a class="navbar-link" href="#menu">Menu</a>
            <a class="navbar-link" href="#about">About</a>
            <a class="navbar-link" href="#contact">Contact</a>

            {% if current_user.is_authenticated %}
                <a class="navbar-link" href="{{ url_for('account') }}">Account</a>
                <a class="navbar-link" href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a class="navbar-link" href="{{ url_for('login') }}">Login</a>
                <a class="navbar-link" href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    {% if current_user.is_authenticated %}
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
    <df-messenger
        chat-title="SavorSuiteschatbot"
        agent-id="f30282d2-c43e-4bab-a93d-50617fcf567e"
        language-code="en">
    </df-messenger>
    {% endif %}
</body>
</html>
